# Every 4 h: refresh station observations, snapshot the Open-Meteo forecasts the first screens
# need, and publish the static site to GitHub Pages. Six scheduled runs a day keep the snapshot within
# its Open-Meteo budget (scripts/snapshot-plan.ts); keep SNAPSHOT_INTERVAL_H in src/lib/cache.ts in step.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions";
# Settings → Actions → General → Workflow permissions: "Read repository contents".
#
# Jobs are split so third-party npm code never runs where a write-capable token exists:
#   refresh (read-only, npm scripts disabled) → commit (write, no npm)
#   → build (read-only: test, build, forecast snapshot into dist/) → deploy (Pages only)
#                                                                  → archive (write, no npm: verification
#                                                                    record → data/verification branch)
# SNODAS history (public/data/obs/snodas-*.json) comes from the manual backfill-snodas.yml; refresh adds only new days.
name: refresh-and-deploy

on:
  schedule:
    - cron: '20 4,8,12,16,20 * * *' # 04:20, 08:20, … 20:20 UTC (off the top of the hour, when runs get delayed)
    - cron: '20 0 * * 1-6'          # 00:20 UTC, Monday to Saturday
    - cron: '20 0 * * 0'            # 00:20 UTC Sundays: full-history refresh (the mode step below matches this exact string)
  workflow_dispatch:
  push:
    branches: [main]

permissions: {} # granted per job below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Choose refresh mode (full history weekly or on manual runs, recent window otherwise)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          full=0
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHEDULE" = "20 0 * * 0" ]; then full=1; fi
          echo "FULL_REFRESH=$full" >> "$GITHUB_ENV"
          echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # BC archives (~49 MB) change once a year and are read only by full refreshes:
      # restore this month's copy, and save only from a full refresh that had to download it.
      - id: bc-restore
        if: env.FULL_REFRESH == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: bc-archives-${{ steps.mode.outputs.m }}
      - name: Fetch observations
        env:
          PW_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          ARCHIVE_MAX_AGE_DAYS: '100000'
        run: npm run obs || echo "::warning::some stations failed; previous files kept"
      - if: env.FULL_REFRESH == '1' && steps.bc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: bc-archives-${{ steps.mode.outputs.m }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obs
          path: public/data/obs/*.json
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push refreshed data; this job runs no npm code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obs
          path: ${{ runner.temp }}/incoming
      # Names, shape, finite bounded numbers; SNODAS files are merged day by day with main's copy, so a refresh
      # that read them before a backfill commit landed can't drop the backfilled history.
      - name: Validate incoming files and re-serialise them (never copy raw bytes)
        run: python3 -I scripts/validate_obs.py "$RUNNER_TEMP/incoming" public/data/obs
      - name: Commit if any reading changed
        run: |
          if [ -n "$(git status --porcelain public/data/obs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/obs
            git commit -m "chore(data): Refresh station observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    needs: commit
    # Runs after a refresh, or on its own for pushes (refresh/commit are skipped then).
    if: ${{ !cancelled() && needs.commit.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verification: ${{ steps.verification.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # include the data commit made earlier in this run
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      # Writes dist/data/fc/ (never committed). A failed or partial snapshot must not block the
      # deploy: the site fetches anything missing from Open-Meteo directly.
      - name: Snapshot forecasts
        timeout-minutes: 9
        continue-on-error: true
        env:
          PW_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: npm run snapshot || echo "::warning::forecast snapshot incomplete; the site fetches the missing data live"
      # The snapshot also writes a forecast-verification record (scripts/verification.ts) to .cache/verification/.
      # It is handed to the archive job, never deployed; nothing here can fail the deploy.
      - name: Look for a verification record
        id: verification
        run: |
          if compgen -G '.cache/verification/*.json' > /dev/null; then echo "record=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.verification.outputs.record == '1'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: .cache/verification/*.json
          retention-days: 7 # a failed archive job can be re-run within a week
          if-no-files-found: ignore
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Forecast-verification archive. Commits the build job's record to the data/verification branch (never
  # main), append-only: a cycle already archived by an earlier run is kept as it is. Runs no npm code, and
  # deploy doesn't wait for it, so a failure here never blocks the site.
  archive:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verification == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to data/verification only; this job runs no npm code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the validator comes from main, never from the data branch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: ${{ runner.temp }}/incoming
      - name: Switch to data/verification (an orphan branch, created on first use)
        run: |
          cp scripts/validate_verification.py "$RUNNER_TEMP/validate_verification.py"
          if git ls-remote --exit-code --heads origin data/verification > /dev/null; then
            git fetch --depth=1 origin data/verification
            git checkout -B data/verification FETCH_HEAD
          else
            git switch --orphan data/verification
          fi
      - name: Validate the record and re-serialise it (never copy raw bytes)
        run: python3 -I "$RUNNER_TEMP/validate_verification.py" --kind cycle "$RUNNER_TEMP/incoming" .
      - name: Commit and push to data/verification only
        run: |
          if [ -d cycles ]; then git add cycles; fi
          if git diff --cached --quiet; then
            echo "cycle already archived by an earlier run"
            exit 0
          fi
          names=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): Archive forecast cycle $names"
          git push origin HEAD:refs/heads/data/verification
