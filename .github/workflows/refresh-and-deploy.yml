# Every 4 h: refresh station observations, snapshot the Open-Meteo forecasts the first screens
# need, and publish the static site to GitHub Pages. Six scheduled runs a day keep the snapshot within
# its Open-Meteo budget (scripts/snapshot-plan.ts); keep SNAPSHOT_INTERVAL_H in src/lib/cache.ts in step.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions";
# Settings → Actions → General → Workflow permissions: "Read repository contents".
#
# GitHub's scheduler is best-effort (slots get dropped or delayed by hours), so an external cron
# (cron-job.org, README "Reliable scheduling") also dispatches this workflow every 4 h. The gate job
# skips a run when the deployed snapshot is under 2 h old, so a slot both triggers fire for spends the
# Open-Meteo budget once.
#
# Jobs are split so third-party npm code never runs where a write-capable token exists:
#   gate (no token, no checkout, no npm) → refresh (read-only, npm scripts disabled) → commit (write, no npm)
#   → build (read-only: test, build, forecast snapshot into dist/) → deploy (Pages only)
#                                                                  → archive (write, no npm: verification
#                                                                    record → data/verification branch)
# SNODAS history (public/data/obs/snodas-*.json) comes from the manual backfill-snodas.yml; refresh adds only new days.
name: refresh-and-deploy

on:
  schedule:
    - cron: '20 4,8,12,16,20 * * *' # 04:20, 08:20, … 20:20 UTC (off the top of the hour, when runs get delayed)
    - cron: '20 0 * * 1-6'          # 00:20 UTC, Monday to Saturday
    - cron: '20 0 * * 0'            # 00:20 UTC Sundays: full-history refresh (the mode step below matches this exact string)
  workflow_dispatch: # also the external cron's trigger (README); incremental unless full_refresh is ticked
    inputs:
      full_refresh:
        description: Full station-history refresh (otherwise the recent window only)
        type: boolean
        default: false
  push:
    branches: [main]

permissions: {} # granted per job below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides whether this run refreshes at all, and in which mode. Reads only the deployed site's public
  # manifest; it checks out nothing and runs no npm code.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      run: ${{ steps.decide.outputs.run }}
      full: ${{ steps.decide.outputs.full }}
    steps:
      - name: Skip if a recent snapshot is deployed; choose the refresh mode
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FULL_INPUT: ${{ inputs.full_refresh }}
        run: |
          # The decision logic is tested by scripts/workflow-gate.test.ts (it runs this script); keep the two in step.
          now=${NOW_S:-$(date -u +%s)}
          # The deployed site's manifest (https://<owner>.github.io/<repo>/), with a query string so the Pages CDN
          # can't answer with its copy from before the run this one queued behind; the test points MANIFEST_URL at a file.
          url=${MANIFEST_URL:-https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/data/fc/manifest.json?t=$now}
          full=0
          # Weekly full refresh: the Sunday schedule, or a dispatch (the external cron) on Sunday 00:00–00:59 UTC.
          if [ "$FULL_INPUT" = "true" ] || [ "$SCHEDULE" = "20 0 * * 0" ]; then full=1; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$(date -u -d "@$now" +%u%H)" = "700" ]; then full=1; fi
          run=1
          # Pushes and ticked full refreshes always run. Otherwise skip when the deployed snapshot is under 2 h
          # old: the other trigger already ran this slot. A weekly full refresh is skipped only after another
          # Sunday run (snapshot generated since Sunday 00:00 UTC), so a late Saturday run can't cancel it.
          if [ "$EVENT" != "push" ] && [ "$FULL_INPUT" != "true" ]; then
            generated=$(curl -fsS -m 20 --retry 2 -H 'Cache-Control: no-cache' "$url" 2>/dev/null \
              | python3 -I -c 'import json, sys; v = json.load(sys.stdin).get("generatedAt"); print(int(v) if type(v) in (int, float) and v > 0 else "")' 2>/dev/null || true)
            if [ -n "$generated" ]; then
              age=$(( now - generated ))
              sunday0=$(( now - (now % 86400) - ($(date -u -d "@$now" +%u) % 7) * 86400 ))
              if [ "$age" -ge 0 ] && [ "$age" -lt 7200 ] && { [ "$full" = 0 ] || [ "$generated" -ge "$sunday0" ]; }; then
                run=0
                echo "deployed snapshot is $(( age / 60 )) min old: skipping this run"
              fi
            else
              echo "no readable deployed manifest: running"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: github.event_name != 'push' && needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Refresh mode (full history weekly or when ticked, recent window otherwise; chosen by gate)
        id: mode
        env:
          FULL: ${{ needs.gate.outputs.full }}
        run: |
          if [ "$FULL" = "1" ]; then echo "FULL_REFRESH=1" >> "$GITHUB_ENV"; else echo "FULL_REFRESH=0" >> "$GITHUB_ENV"; fi
          echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # BC archives (~49 MB) change once a year and are read only by full refreshes:
      # restore this month's copy, and save only from a full refresh that had to download it.
      - id: bc-restore
        if: env.FULL_REFRESH == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: bc-archives-${{ steps.mode.outputs.m }}
      - name: Fetch observations
        env:
          PW_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          ARCHIVE_MAX_AGE_DAYS: '100000'
        run: npm run obs || echo "::warning::some stations failed; previous files kept"
      - if: env.FULL_REFRESH == '1' && steps.bc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: bc-archives-${{ steps.mode.outputs.m }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obs
          path: public/data/obs/*.json
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push refreshed data; this job runs no npm code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obs
          path: ${{ runner.temp }}/incoming
      # Names, shape, finite bounded numbers; SNODAS files are merged day by day with main's copy, so a refresh
      # that read them before a backfill commit landed can't drop the backfilled history.
      - name: Validate incoming files and re-serialise them (never copy raw bytes)
        run: python3 -I scripts/validate_obs.py "$RUNNER_TEMP/incoming" public/data/obs
      - name: Commit if any reading changed
        run: |
          if [ -n "$(git status --porcelain public/data/obs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/obs
            git commit -m "chore(data): Refresh station observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    needs: [gate, commit]
    # Runs after a refresh, or on its own for pushes (refresh/commit are skipped then); never when gate skipped the run.
    if: ${{ !cancelled() && needs.gate.outputs.run == '1' && needs.commit.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verification: ${{ steps.verification.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # include the data commit made earlier in this run
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      # Writes dist/data/fc/ (never committed). A failed or partial snapshot must not block the
      # deploy: the site fetches anything missing from Open-Meteo directly.
      - name: Snapshot forecasts
        timeout-minutes: 9
        continue-on-error: true
        env:
          PW_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: npm run snapshot || echo "::warning::forecast snapshot incomplete; the site fetches the missing data live"
      # The snapshot also writes a forecast-verification record (scripts/verification.ts) to .cache/verification/.
      # It is handed to the archive job, never deployed; nothing here can fail the deploy.
      - name: Look for a verification record
        id: verification
        run: |
          if compgen -G '.cache/verification/*.json' > /dev/null; then echo "record=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.verification.outputs.record == '1'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: .cache/verification/*.json
          retention-days: 7 # a failed archive job can be re-run within a week
          if-no-files-found: ignore
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Forecast-verification archive. Commits the build job's record to the data/verification branch (never
  # main), append-only: a cycle already archived by an earlier run is kept as it is. Runs no npm code, and
  # deploy doesn't wait for it, so a failure here never blocks the site.
  archive:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verification == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to data/verification only; this job runs no npm code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the validator comes from main, never from the data branch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: ${{ runner.temp }}/incoming
      - name: Switch to data/verification (an orphan branch, created on first use)
        run: |
          cp scripts/validate_verification.py "$RUNNER_TEMP/validate_verification.py"
          if git ls-remote --exit-code --heads origin data/verification > /dev/null; then
            git fetch --depth=1 origin data/verification
            git checkout -B data/verification FETCH_HEAD
          else
            git switch --orphan data/verification
          fi
      - name: Validate the record and re-serialise it (never copy raw bytes)
        run: python3 -I "$RUNNER_TEMP/validate_verification.py" --kind cycle "$RUNNER_TEMP/incoming" .
      - name: Commit and push to data/verification only
        run: |
          if [ -d cycles ]; then git add cycles; fi
          if git diff --cached --quiet; then
            echo "cycle already archived by an earlier run"
            exit 0
          fi
          names=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): Archive forecast cycle $names"
          git push origin HEAD:refs/heads/data/verification
