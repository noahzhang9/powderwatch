# Weekly update PRs for npm packages and the SHA-pinned GitHub Actions.
# The deploy workflow never runs on pull requests, so a Dependabot PR cannot deploy;
# merge it after the PR's checks (run locally or via Actions on main) pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
